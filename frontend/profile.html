<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html" class="active">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">
      <h1>My Profile</h1>
    </header>

    <!-- PROFILE INFO -->
    <section class="form-card">
      <h3 class="section-title">Account Information</h3>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" value="Siddhi Agarwal" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" value="siddhi@example.com" disabled />
      </div>
    </section>

    <!-- PASSWORD -->
    <section class="form-card" style="margin-top:30px;">
      <h3 class="section-title">Change Password</h3>

      <div class="form-group">
        <label>Current Password</label>
        <input type="password" />
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" />
      </div>

      <button class="btn-primary full-width">
        Update Password
      </button>
    </section>

    <!-- LOGOUT -->
    <section class="form-card" style="margin-top:30px; text-align:center;">
      <button class="btn-outline">
        Logout
      </button>
    </section>

  </main>
</div>

</body>
</html>
