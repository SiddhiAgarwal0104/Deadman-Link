<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html" class="active">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">
      <h1>My Profile</h1>
    </header>

    <!-- PROFILE INFO -->
    <section class="form-card">
      <h3 class="section-title">Account Information</h3>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" disabled />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" disabled />
      </div>
    </section>

    <!-- LOGOUT -->
    <section class="form-card" style="margin-top:30px; text-align:center;">
      <button class="btn-outline" onclick="logoutUser()">Logout</button>
    </section>

  </main>
</div>

<script src="js/config.js"></script>
<script>
/* protect page */
if (!getToken()) {
  window.location.href = "login.html";
}

/* load profile */
fetch(`${API_BASE}/auth/me`, {
  headers: {
    Authorization: `Bearer ${getToken()}`
  }
})
.then(res => res.json())
.then(user => {
  document.getElementById("name").value = user.name;
  document.getElementById("email").value = user.email;
});

/* logout */
function logoutUser() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}
</script>

</body>
</html>
