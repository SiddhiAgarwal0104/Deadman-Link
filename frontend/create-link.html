<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Link | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-link.html" class="active">Create Link</a>
      <a href="my-links.html">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">
      <h1>Create New Link</h1>
    </header>

    <form class="form-card">

      <!-- BASIC -->
      <div class="form-group">
        <label>Original URL</label>
        <input type="url" placeholder="https://example.com" required />
      </div>

      <div class="form-group">
        <label>Custom Slug (optional)</label>
        <input type="text" placeholder="my-secure-link" />
      </div>

      <!-- ACCESS RULES -->
      <h3 class="section-title">Access Rules</h3>

      <div class="form-group inline">
        <label>Expiry Date</label>
        <input type="datetime-local" />
      </div>

      <div class="form-group">
        <label>Password Protection</label>
        <input type="password" placeholder="Set password (optional)" />
      </div>

      <div class="form-group inline">
        <label>Access Limit</label>
        <input type="number" placeholder="e.g. 5" />
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" />
        <span>One-Time Access</span>
      </div>

      <!-- SCHEDULED ACTIVATION -->
      <h3 class="section-title">Scheduled Activation</h3>

      <div class="form-group inline">
        <label>Active From</label>
        <input type="datetime-local" />
      </div>

      <div class="form-group inline">
        <label>Active Till</label>
        <input type="datetime-local" />
      </div>

      <!-- SUBMIT -->
      <button class="btn-primary full-width">
        Create Link
      </button>

    </form>

  </main>
</div>

</body>
</html>
<script src="js/config.js"></script>
<script>
protectPage();

const form = document.querySelector("form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const inputs = form.querySelectorAll("input");

  const originalUrl = inputs[0].value;
  const slug = inputs[1].value || null;
  const expiresAt = inputs[2].value || null;
  const password = inputs[3].value || null;
  const maxClicks = inputs[4].value || null;
  const oneTime = inputs[5].checked;

  const payload = {
    originalUrl,
    slug,
    expiresAt,
    password,
    maxClicks,
    oneTime
  };

  console.log("Create payload:", payload); // 🔍 DEBUG

  const res = await fetch(`${API_BASE}/link`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${getToken()}`
    },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  if (res.ok) {
    alert("Link created");
    window.location.href = "my-links.html";
  } else {
    alert(data.message || "Failed to create link");
  }
});
</script>
