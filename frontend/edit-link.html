<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Link | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html" class="active">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">
      <h1>Edit Link</h1>
    </header>

    <form class="form-card">

      <!-- BASIC -->
      <div class="form-group">
        <label>Original URL</label>
        <input
          type="url"
          value="https://example.com"
          disabled
        />
      </div>

      <div class="form-group">
        <label>Custom Slug</label>
        <input
          type="text"
          value="secure-link"
        />
      </div>

      <!-- ACCESS RULES -->
      <h3 class="section-title">Access Rules</h3>

      <div class="form-group inline">
        <label>Expiry Date</label>
        <input type="datetime-local" value="2025-12-31T23:59" />
      </div>

      <div class="form-group">
        <label>Password Protection</label>
        <input
          type="password"
          placeholder="Update password (optional)"
        />
      </div>

      <div class="form-group inline">
        <label>Access Limit</label>
        <input type="number" value="5" />
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" checked />
        <span>One-Time Access</span>
      </div>

      <!-- SCHEDULE -->
      <h3 class="section-title">Scheduled Activation</h3>

      <div class="form-group inline">
        <label>Active From</label>
        <input type="datetime-local" value="2025-12-20T10:00" />
      </div>

      <div class="form-group inline">
        <label>Active Till</label>
        <input type="datetime-local" value="2025-12-25T22:00" />
      </div>

      <!-- ACTION -->
      <button class="btn-primary full-width">
        Update Link
      </button>

    </form>

  </main>
</div>

</body>
</html>
<script src="js/config.js"></script>
<script>
protectPage();

const params = new URLSearchParams(window.location.search);
const linkId = params.get("id");

if (!linkId) {
  alert("Invalid link");
  window.location.href = "my-links.html";
}

const form = document.querySelector("form");
const inputs = form.querySelectorAll("input");

const originalUrlInput = inputs[0];
const slugInput = inputs[1];
const expiryInput = inputs[2];
const passwordInput = inputs[3];
const limitInput = inputs[4];
const oneTimeCheckbox = inputs[5];

// 🔹 LOAD LINK
fetch(`${API_BASE}/link/${linkId}`, {
  headers: {
    Authorization: `Bearer ${getToken()}`
  }
})
.then(async res => {
  if (!res.ok) throw new Error("Link not found");
  return res.json();
})
.then(link => {
  originalUrlInput.value = link.originalUrl;
  slugInput.value = link.slug || "";
  expiryInput.value = link.expiresAt
    ? link.expiresAt.slice(0, 16)
    : "";
  limitInput.value = link.maxClicks || "";
  oneTimeCheckbox.checked = link.oneTime || false;
})
.catch(err => {
  alert(err.message);
  window.location.href = "my-links.html";
});

// 🔹 UPDATE LINK
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    slug: slugInput.value || null,
    expiresAt: expiryInput.value || null,
    maxClicks: limitInput.value || null,
    oneTime: oneTimeCheckbox.checked
  };

  if (passwordInput.value) {
    payload.password = passwordInput.value;
  }

  const res = await fetch(`${API_BASE}/link/${linkId}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${getToken()}`
    },
    body: JSON.stringify(payload)
  });

  if (res.ok) {
    alert("Link updated successfully");
    window.location.href = "my-links.html";
  } else {
    alert("Failed to update link");
  }
});
</script>
