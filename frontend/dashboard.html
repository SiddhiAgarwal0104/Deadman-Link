<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>

    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <h1>Dashboard</h1>
      <a href="create-link.html" class="btn-primary">+ New Link</a>
    </header>

    <!-- STATS -->
    <section class="stats">
      <div class="stat-card">
        <h3>Total Links</h3>
        <p>24</p>
      </div>

      <div class="stat-card">
        <h3>Active Links</h3>
        <p>12</p>
      </div>

      <div class="stat-card">
        <h3>Expired</h3>
        <p>8</p>
      </div>

      <div class="stat-card">
        <h3>Total Clicks</h3>
        <p>1,245</p>
      </div>
    </section>

    <!-- PLACEHOLDER CONTENT -->
    <section class="content-box">
      <h2>Recent Activity</h2>
      <p>Your recently created links will appear here.</p>
    </section>

  </main>
</div>

</body>
</html>
