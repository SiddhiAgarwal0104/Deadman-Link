<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>

    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <h1>Dashboard</h1>
      <a href="create-link.html" class="btn-primary">+ New Link</a>
    </header>

    <!-- STATS -->
    <section class="stats">
      <div class="stat-card">
  <h3>Total Links</h3>
  <p id="totalLinks">0</p>
</div>

<div class="stat-card">
  <h3>Active Links</h3>
  <p id="activeLinks">0</p>
</div>

<div class="stat-card">
  <h3>Expired</h3>
  <p id="expiredLinks">0</p>
</div>

<div class="stat-card">
  <h3>Total Clicks</h3>
  <p id="totalClicks">0</p>
</div>

    </section>

    <!-- PLACEHOLDER CONTENT -->
    <section class="content-box">
      <h2>Recent Activity</h2>
      <p>Your recently created links will appear here.</p>
    </section>

  </main>
</div>

</body>
</html>
<!-- SAME HTML AS YOURS ABOVE -->

<script src="js/config.js"></script>
<script>
protectPage();

fetch(`${API_BASE}/dashboard`, {
  headers: {
    Authorization: `Bearer ${getToken()}`
  }
})
.then(res => res.json())
.then(data => {
  console.log("Dashboard:", data);

  document.getElementById("totalLinks").innerText = data.totalLinks;
  document.getElementById("totalClicks").innerText = data.totalClicks;

  // optional (agar backend bheje)
  document.getElementById("activeLinks").innerText = data.activeLinks || 0;
  document.getElementById("expiredLinks").innerText = data.expiredLinks || 0;
});
</script>
