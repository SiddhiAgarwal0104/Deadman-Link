<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Links | Deadman-Link</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Deadman<span>Link</span></h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-link.html">Create Link</a>
      <a href="my-links.html" class="active">My Links</a>
      <a href="collections.html">Collections</a>
      <a href="profile.html">Profile</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">
      <h1>My Links</h1>
      <a href="create-link.html" class="btn-primary">+ New Link</a>
    </header>

    <!-- LINKS LIST -->
    <div class="table-card">

      <div class="table-header">
        <span>Short Link</span>
        <span>Status</span>
        <span>Clicks</span>
        <span>Actions</span>
      </div>

      

     

    </div>

  </main>
</div>

</body>
</html>
<!-- SAME HTML -->

<script src="js/config.js"></script>
<script>
protectPage();

const table = document.querySelector(".table-card");

fetch(`${API_BASE}/link/my`, {
  headers: {
    Authorization: `Bearer ${getToken()}`
  }
})
.then(res => res.json())
.then(links => {
  console.log("My links:", links);

  links.forEach(link => {
    const row = document.createElement("div");
    row.className = "table-row";

   row.innerHTML = `
  <span>dmn.lk/${link.shortCode}</span>
  <span class="badge ${link.active ? "active" : "expired"}">
    ${link.active ? "Active" : "Expired"}
  </span>
  <span>${link.clickCount || 0}</span>
  <span class="actions">
    <button onclick="editLink('${link._id}')">Edit</button>
    <button onclick="copyLink('dmn.lk/${link.shortCode}')">Copy</button>
    <button class="danger" onclick="deleteLink('${link._id}')">Delete</button>
  </span>
`;


    table.appendChild(row);
  });
});
function copyLink(text) {
  navigator.clipboard.writeText(text);
  alert("Link copied!");
}

function editLink(id) {
  window.location.href = `edit-link.html?id=${id}`;
}


function deleteLink(id) {
  fetch(`${API_BASE}/link/${id}`, {
    method: "DELETE",
    headers: {
      Authorization: `Bearer ${getToken()}`
    }
  }).then(() => location.reload());
}
</script>
